<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Author Positioning Workbook — Mint Mantis</title>
<style>
:root{
  --paper:#FAFAF8; --panel:#FFFFFF; --ink:#20281F; --muted:#5D6A5E; --faint:#8A968B;
  --accent:#206B4E; --accent-ink:#FFFFFF; --accent-soft:#EAF2ED;
  --hint:#B07C24; --hint-soft:#FBF4E6;
  --trap:#A3512E; --trap-soft:#F9EEE8;
  --line:#E2E6DD; --line-strong:#C9D0C6;
  --done:#206B4E; --shadow:0 1px 2px rgba(32,40,31,.05),0 8px 24px rgba(32,40,31,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#131813; --panel:#1B211B; --ink:#E8EBE4; --muted:#A7B2A6; --faint:#77836F;
    --accent:#5FB88E; --accent-ink:#0E1510; --accent-soft:#1E2E25;
    --hint:#D9A84E; --hint-soft:#2A2419;
    --trap:#E08A5E; --trap-soft:#2C201A;
    --line:#2A322A; --line-strong:#3A443A;
    --done:#5FB88E; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#131813; --panel:#1B211B; --ink:#E8EBE4; --muted:#A7B2A6; --faint:#77836F;
  --accent:#5FB88E; --accent-ink:#0E1510; --accent-soft:#1E2E25;
  --hint:#D9A84E; --hint-soft:#2A2419;
  --trap:#E08A5E; --trap-soft:#2C201A;
  --line:#2A322A; --line-strong:#3A443A;
  --done:#5FB88E; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --paper:#FAFAF8; --panel:#FFFFFF; --ink:#20281F; --muted:#5D6A5E; --faint:#8A968B;
  --accent:#206B4E; --accent-ink:#FFFFFF; --accent-soft:#EAF2ED;
  --hint:#B07C24; --hint-soft:#FBF4E6;
  --trap:#A3512E; --trap-soft:#F9EEE8;
  --line:#E2E6DD; --line-strong:#C9D0C6;
  --done:#206B4E; --shadow:0 1px 2px rgba(32,40,31,.05),0 8px 24px rgba(32,40,31,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex; min-height:100vh; max-width:1180px; margin:0 auto}

/* ---------- rail ---------- */
.rail{
  width:276px; flex:0 0 276px; padding:36px 20px 36px 28px;
  border-right:1px solid var(--line); position:sticky; top:0; align-self:flex-start;
  max-height:100vh; overflow-y:auto;
}
.brand{margin-bottom:24px}
.brand .kicker{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600}
.brand h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-size:21px; line-height:1.25; margin:6px 0 2px; font-weight:600; text-wrap:balance}
.brand .sub{font-size:12.5px; color:var(--muted)}
.navlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px}
.navlist button{
  display:flex; align-items:baseline; gap:10px; width:100%; text-align:left;
  background:none; border:0; border-radius:8px; padding:7px 10px; cursor:pointer;
  color:var(--muted); font:13.5px/1.35 inherit; font-family:inherit;
}
.navlist button:hover{background:var(--accent-soft); color:var(--ink)}
.navlist button.active{background:var(--accent); color:var(--accent-ink)}
.navlist button.active .navnum{color:var(--accent-ink); opacity:.75}
.navnum{font-size:11px; font-variant-numeric:tabular-nums; color:var(--faint); width:20px; flex:0 0 20px}
.navdot{margin-left:auto; font-size:11px; color:var(--done); visibility:hidden}
.navlist button.done .navdot{visibility:visible}
.navgroup{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); margin:16px 0 6px 10px; font-weight:600}
.railfoot{margin-top:26px; font-size:11.5px; color:var(--faint); line-height:1.5}
.savebadge{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); margin-top:8px}
.savebadge::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--done); flex:0 0 7px}
.savebadge.warn::before{background:var(--trap)}
.railbtn{
  margin-top:12px; width:100%; border:1px solid var(--line-strong); background:transparent;
  color:var(--muted); border-radius:8px; padding:8px 10px; font:600 12px/1 inherit; font-family:inherit; cursor:pointer;
}
.railbtn:hover{color:var(--ink); border-color:var(--faint)}
.storagewarn{
  margin-top:12px; padding:10px 12px; border-radius:9px; background:var(--trap-soft);
  border:1px solid var(--trap); color:var(--ink); font-size:11.5px; line-height:1.5; display:none;
}
.storagewarn.show{display:block}

/* ---------- main ---------- */
.main{flex:1; min-width:0; padding:44px 48px 80px}
.step{display:none; max-width:640px}
.step.visible{display:block}
.eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600; margin:0 0 10px}
.step h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-size:30px; line-height:1.2; margin:0 0 14px; font-weight:600; text-wrap:balance}
.intro{color:var(--muted); font-size:15.5px; margin:0 0 8px; max-width:60ch}
.intro strong{color:var(--ink)}
.callout{
  border-left:3px solid var(--accent); background:var(--accent-soft);
  padding:12px 16px; border-radius:0 10px 10px 0; margin:20px 0 4px;
  font-size:14px; color:var(--ink); max-width:60ch;
}
.callout .cn{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); font-weight:700; display:block; margin-bottom:3px}
.callout.trap{border-left-color:var(--trap); background:var(--trap-soft)}
.callout.trap .cn{color:var(--trap)}

.q{margin:30px 0 0; padding:22px 24px; background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow)}
.q label{display:block; font-weight:600; font-size:15.5px; line-height:1.45; margin-bottom:4px}
.q .optional{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:700; margin-left:6px}
.q .why{font-size:13.5px; color:var(--muted); margin:0 0 12px; max-width:60ch}
.q textarea{
  width:100%; border:1px solid var(--line-strong); border-radius:9px; background:var(--paper);
  color:var(--ink); font:15px/1.55 inherit; font-family:inherit; padding:11px 13px; resize:vertical;
}
.q textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent)}
.q textarea::placeholder{color:var(--faint)}
details.hintbox{margin-top:12px; border:1px dashed var(--hint); border-radius:9px; background:var(--hint-soft)}
details.hintbox summary{
  cursor:pointer; padding:9px 13px; font-size:13px; font-weight:600; color:var(--hint);
  list-style:none; display:flex; align-items:center; gap:7px;
}
details.hintbox summary::-webkit-details-marker{display:none}
details.hintbox summary::before{content:"◆"; font-size:9px}
details.hintbox[open] summary{border-bottom:1px dashed var(--hint)}
details.hintbox .hintbody{padding:11px 14px 13px; font-size:13.5px; line-height:1.55; color:var(--ink)}
details.hintbox .hintbody em{color:var(--muted)}
.recall{
  margin:26px 0 0; padding:16px 20px; border:1px solid var(--line); border-radius:12px;
  background:var(--paper); font-size:13.5px;
}
.recall .rc-title{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); font-weight:700; margin-bottom:6px}
.recall .rc-body{white-space:pre-wrap; color:var(--muted); font-size:13.5px; line-height:1.55; max-height:180px; overflow-y:auto}
.recall .rc-body.empty{font-style:italic}

/* assembled statement */
.canvas-stmt{
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:19px; line-height:1.65; padding:26px 30px; border-radius:14px;
  background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); margin:26px 0 0;
}
.canvas-stmt .slot{color:var(--accent); font-weight:600}
.canvas-stmt .slot.empty{color:var(--faint); font-weight:400; font-style:italic}
.canvas-frame{font-size:12px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); font-weight:600; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin-bottom:14px}

/* nav buttons */
.stepnav{display:flex; gap:12px; margin-top:38px; align-items:center}
.btn{
  border:0; border-radius:10px; padding:11px 22px; font:600 14.5px/1 inherit; font-family:inherit;
  cursor:pointer; background:var(--accent); color:var(--accent-ink);
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line-strong)}
.btn.ghost:hover{color:var(--ink); border-color:var(--faint); filter:none}
.stepcount{margin-left:auto; font-size:12.5px; color:var(--faint); font-variant-numeric:tabular-nums}

/* review */
.review-block{margin:26px 0; padding:20px 24px; background:var(--panel); border:1px solid var(--line); border-radius:14px}
.review-block h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-size:17px; margin:0 0 10px}
.review-item{margin:0 0 14px}
.review-item .rq{font-size:13px; font-weight:600; color:var(--muted); margin:0 0 2px}
.review-item .ra{font-size:14px; white-space:pre-wrap; margin:0}
.review-item .ra.blank{color:var(--hint); font-style:italic}
.meter{height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin:14px 0 6px}
.meter>div{height:100%; background:var(--done); border-radius:99px; transition:width .3s ease}
.exportrow{display:flex; flex-wrap:wrap; gap:12px; margin-top:22px}
.exportnote{font-size:13.5px; color:var(--muted); margin-top:14px; max-width:56ch}
.exportnote a{color:var(--accent)}

/* welcome specifics */
.howlist{margin:22px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:14px; max-width:58ch}
.howlist li{display:flex; gap:14px; font-size:15px}
.hownum{
  flex:0 0 26px; height:26px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
  font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:2px;
}
.stagemap{margin:26px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:0; max-width:58ch}
.stagemap li{display:flex; gap:14px; position:relative; padding:0 0 18px}
.stagemap li::before{
  content:""; position:absolute; left:12px; top:26px; bottom:0; width:2px; background:var(--line);
}
.stagemap li:last-child::before{display:none}
.stagenum{
  flex:0 0 26px; height:26px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
  font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; position:relative; z-index:1;
}
.stagemap .stagename{font-weight:600; font-size:15px}
.stagemap .stagedesc{font-size:13.5px; color:var(--muted); line-height:1.5}
.stagemap .stagetime{font-size:11.5px; color:var(--faint); font-variant-numeric:tabular-nums}

/* mobile */
.mobilebar{display:none}
@media (max-width:860px){
  .app{flex-direction:column}
  .rail{position:static; width:auto; flex:none; max-height:none; border-right:0; border-bottom:1px solid var(--line); padding:22px 20px 8px}
  .navwrap{display:none}
  .navwrap.open{display:block; padding-bottom:14px}
  .mobilebar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 0 14px; cursor:pointer; border:0; background:none; width:100%;
    color:var(--ink); font:600 14px/1 inherit; font-family:inherit;
  }
  .main{padding:30px 20px 70px}
  .step h2{font-size:25px}
}
@media print{
  .rail,.stepnav,.exportrow,.mobilebar{display:none !important}
  .step{display:block !important; max-width:none}
  body{background:#fff; color:#000}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="kicker">Mint Mantis · Author Strategy</div>
      <h1>Author Workbooks</h1>
      <div class="sub">Positioning Workbook — for authors</div>
    </div>
    <button class="mobilebar" id="mobiletoggle" aria-expanded="false">
      <span id="mobilelabel">Contents</span><span>▾</span>
    </button>
    <div class="navwrap" id="navwrap">
      <nav aria-label="Workbook steps"><ul class="navlist" id="navlist"></ul></nav>
      <div class="railfoot">
        <span class="savebadge" id="savebadge">Autosave on</span>
        <div class="meter" style="margin:10px 0 4px"><div id="railmeterfill" style="width:0%"></div></div>
        <div id="railprog" style="font-size:11px; color:var(--muted)"></div>
        <div class="storagewarn" id="storagewarn"><strong>Autosave is blocked in this browser.</strong> Your answers live only on this open page — use “Download backup” often, and before closing.</div>
        <button class="railbtn" id="savefilebtn">Save progress to file</button>
        <button class="railbtn" id="loadfilebtn">Resume from a saved file</button>
        <input type="file" id="loadfileinput" accept=".json,application/json" style="display:none">
      </div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script src="./jspdf.umd.min.js"></script>
<script>
"use strict";
/* ---------------- content model ---------------- */
const HINT = "Stuck? Open an example";
const STEPS = [
{ id:"welcome", nav:"Welcome", group:null, eyebrow:"Before you begin", title:"Find the positioning only you can claim.",
  intro:[
    "This workbook takes you through the five stages of preparing your book for fundraising and launch. It starts with April Dunford's <strong>Obviously Awesome</strong> positioning process, because every later decision — your message, your outreach, your pricing, your campaign page — inherits its quality from the positioning underneath it.",
    "This workbook is built for nonfiction authors who want the book to open a practice: speaking, coaching, consulting, workshops. Writing memoir or fiction? Stages 1 and 2 (positioning and messaging) still earn their keep; read the services questions as optional.",
    "The point is not to fill boxes. It's to arrive at answers <strong>you</strong> believe, because you found them. Budget three to four hours across two or three sittings, plus thinking time between them — natural break points are marked on the map below."
  ],
  html:`<ul class="stagemap">
    <li><span class="stagenum">1</span><div><div class="stagename">Positioning <span class="stagetime">· ~75 min · sitting one</span></div><div class="stagedesc">Who this book must not fail, what you're truly up against, and what only you can claim. Nine steps, in order.</div></div></li>
    <li><span class="stagenum">2</span><div><div class="stagename">Messaging <span class="stagetime">· ~25 min · sitting two</span></div><div class="stagedesc">Turning the positioning into words: your elevator answer, page headline, promise, and which stories lead.</div></div></li>
    <li><span class="stagenum">3</span><div><div class="stagename">Sales readiness <span class="stagetime">· ~30 min</span></div><div class="stagedesc">Your network, sorted; your openers, drafted; your campaign outreach, honestly sized.</div></div></li>
    <li><span class="stagenum">4</span><div><div class="stagename">System &amp; pricing <span class="stagetime">· ~30 min · sitting three</span></div><div class="stagedesc">The ladder from free tool to premium offers, priced — this becomes your campaign's reward tiers.</div></div></li>
    <li><span class="stagenum">5</span><div><div class="stagename">The proposal <span class="stagetime">· ~30 min</span></div><div class="stagedesc">Raw materials for the campaign page: bio, outline, numbers, video, boundaries. Then review and send.</div></div></li>
  </ul>
  <ul class="howlist">
    <li><span class="hownum">a</span><div><strong>Work in order.</strong> Each step builds on the one before — your earlier answers reappear when a later step needs them.</div></li>
    <li><span class="hownum">b</span><div><strong>Try before peeking.</strong> Most questions carry an example behind an amber panel — one running case: Marcus, who burned out completely, rebuilt over 14 months, and turned what worked into a framework, a book, and a business. Attempt your own answer first, then open his and translate.</div></li>
    <li><span class="hownum">c</span><div><strong>Watch for the trap.</strong> Each step names the mistake most authors make right there. Read it before answering.</div></li>
    <li><span class="hownum">d</span><div><strong>Your work is saved two ways.</strong> It autosaves in this browser as you type — and the “Save progress to file” button on the left downloads a progress file you can keep or email to yourself. Opening the workbook on another device or browser? Click “Resume from a saved file” and you'll pick up exactly where you left off. At the end, you'll download your answers as a PDF and email them to Mint Mantis.</div></li>
  </ul>`,
  fields:[
    {k:"au_name", label:"Your name", why:"", rows:1, ph:"Jane Smith"},
    {k:"au_book", label:"Your book's working title", why:"", rows:1, ph:"A working title is fine"},
    {k:"au_email", label:"Your email", why:"So we can reply to your submission.", rows:1, ph:"you@example.com"}
  ]
},
{ id:"dest", nav:"The Destination", group:"Groundwork", eyebrow:"Groundwork", title:"Before positioning: where is this going?",
  intro:["The book is a front door to a larger goal — a practice, a company, a platform. Before we position the door, we define the house. Every later answer gets judged against what you write here."],
  trap:"Most authors answer this stage with a feeling — “get the book out there,” “build momentum.” Feelings can't be planned toward, and a campaign can't be designed around them. If your answers here have no numbers in them, they aren't answers yet.",
  fields:[
    {k:"dest_success", label:"One year after the campaign, what does success look like — in numbers?", why:"A book that wins readers but attracts the wrong clients or opportunities is a failure for you. Name clients, engagements, revenue, or whatever your real goal is measured in.", rows:4,
     hint:"Marcus (our running case — he burned out completely, rebuilt over 14 months, and turned what worked into a framework he now teaches): “8 recovery-coaching clients, 4 paid team workshops on burnout, a 2,500-reader newsletter — and the book is what opened those doors.”"},
    {k:"dest_offer", label:"What do you sell today — and what would you like to sell?", why:"Format, duration, price. If you've never charged, write what you'd charge if forced to name a number tomorrow. Your campaign's high-value reward tiers are built from this.", rows:5,
     hint:"Marcus: “Today: free calls with anyone who reaches out, and the occasional talk for whatever they offer. Want: a $350 ‘First 90 Days of Recovery’ course, $150/mo recovery circle, $3,000 team workshop days.” (USD, illustrative.)"},
    {k:"dest_clients", label:"Who have you already served — paid or unpaid — and what changed for them?", why:"Name 3–5 real people (initials fine): role, situation when they came to you, outcome. These become testimonials and campaign-page proof. No clients yet? Beta readers, people you've informally helped, and colleagues who sought your advice all count — just label guesses as guesses.", rows:6,
     hint:"Marcus: “D.T., a founder I talked through the month he couldn't open his laptop — back running his company, on humane hours. My old colleague who recognized her own crash coming and changed course before it hit.”"},
    {k:"dest_network", label:"Who could you ask TODAY for an endorsement, a bulk order, or a booking?", why:"List everyone who takes your calls: professional relationships, former colleagues now senior, industry contacts, old classmates. This list is the campaign.", rows:6,
     hint:"Marcus: “My former agency partners, the HR director who watched my collapse and my comeback, the podcast host who had me tell the story, everyone who ever DMed me ‘how did you get through it?’”"},
    {k:"dest_goal", label:"Your campaign's primary goal: (a) maximize preorders to attract traditional publishers, or (b) revenue and clients, where fewer, bigger buyers win and hybrid or self-publishing is fine?", why:"Decide this FIRST \u2014 it shapes everything that follows: (a) optimizes volume and low tiers, (b) optimizes high-value outreach. You'll revisit it at the end with everything you've learned.", rows:3,
     hint:"Marcus chose (b): “A publisher would be lovely, but ten coaching clients and two company workshops change my year. Volume is the bonus, not the goal.”"}
  ]
},
{ id:"d1", nav:"Best customers", group:"Stage 1 · Positioning", eyebrow:"Stage 1 · Positioning — Step 1 of 9", title:"Start with the people you've served best.",
  intro:["The process begins here, not with slogans: <strong>your best positioning is hiding in the people who already love what you do.</strong> Not everyone you've helped — the ones where it clearly, almost easily, worked."],
  trap:"The trap here is listing the people you'd LIKE to serve instead of the people you actually served well. Aspiration contaminates the data. Only real names, real situations, real outcomes — the pattern you need is hiding in what already worked, not in what you hope works next.",
  fields:[
    {k:"d1_best", label:"List 3–5 people you have helped with the problem your book addresses — where it visibly worked.", why:"Formally or informally, paid or not. For each: initials, role, the situation they were in, what changed. Your Groundwork list is a fine starting point — reuse and expand it. No track record yet? Interview three people who match your intended reader this week, and treat their words as your data.", rows:7,
     hint:"Think of the people who still thank you years later, or quote you back to yourself. Marcus: “The people who DM me at midnight because they read my post about the collapse. D.T., who says ‘one day at the bottom of the mountain’ back to me — my own phrase, living in someone else's recovery.”"},
    {k:"d1_common", label:"Now look at that list. What do the people who got the MOST value have in common?", why:"This is the first aha of the method: patterns in your real track record, not in your ambitions. Age? Seniority? Industry? What had just happened to them?", rows:4,
     hint:"Marcus: “I assumed my people were ‘anyone stressed.’ The list said otherwise: every one was a high performer whose identity WAS the output — and each was hiding the cracks from everyone, like I did. The pattern surprised me — that's how you know it's real.”"}
  ]
},
{ id:"d2", nav:"Put down baggage", group:null, eyebrow:"Stage 1 · Positioning — Step 2 of 9", title:"Put down the positioning baggage.",
  intro:["Every author carries a default description of their book — usually the one that formed first, not the one that serves best. The instruction is simple: write it down, look at it, and consciously decide what you're free to let go of."],
  trap:"The trap is defending “it's for everyone” because narrowing feels like turning readers away. It's the reverse: a book for everyone competes with everything and gets chosen by no one. Narrowing is not shrinking your audience — it's the only way to win one. The general reader can still buy the book; they just aren't who the pitch speaks to.",
  fields:[
    {k:"d2_current", label:"When someone at a dinner party asks 'what's your book about?' — what do you currently say? Write it exactly, in one breath.", why:"Don't improve it. Capture the real current answer — that's the baseline we're repositioning.", rows:3,
     hint:"Marcus's honest version: “It's about my burnout… and, you know, what I learned… it's kind of a recovery story but also practical…” Notice how it apologizes and trails off. Write yours as honestly."},
    {k:"d2_wish", label:"And what do you WISH you could say — the answer that would make the right person lean in?", why:"The gap between these two answers usually reveals the positioning problem better than any framework.", rows:3,
     hint:"Marcus: “It's the book that catches the high performer who is secretly cracking — written by someone who cracked all the way, and came back with the map.”"},
    {k:"d2_baggage", label:"What assumptions about this book might you need to release?", why:"E.g., 'it's for everyone,' 'it's my life story,' 'the entertaining stories are the heart of it,' 'I shouldn't lead with my credential.' Naming them is what lets you choose deliberately instead of by habit.", rows:5,
     hint:"Most first drafts promise the book is for “anyone who…” — the heaviest baggage there is. Marcus's list: ‘everything about my dark year must stay in’ · ‘it's for anyone who's ever felt stressed’ · ‘calling it a method feels arrogant — I just survived.’ Releasing the last one mattered most: what he did IS a method, and claiming it is what lets him teach it."}
  ]
},
{ id:"d3", nav:"True alternatives", group:null, eyebrow:"Stage 1 · Positioning — Step 3 of 9", title:"What would they do if you didn't exist?",
  intro:["The sharpest reframe in all of positioning: <strong>you are not positioned against competitors — you are positioned against whatever your reader would actually do instead.</strong> Often that's 'nothing,' 'push harder,' or a cheap generic service."],
  recall:{title:"From Step 1 — your best-served people", key:"d1_common"},
  trap:"The trap is naming famous authors as your competition. Your reader's real alternative usually isn't a rival book — it's doing nothing, hiring a generic service, or asking a friend. If your list is all books, you haven't found the real default yet — and the real default is the one your positioning must beat.",
  fields:[
    {k:"d3_alts", label:"If this book didn't exist, what would your reader do about the problem? List everything.", why:"Other books, services, advisors, free content, DIY, denial. Include the do-nothing option — it's usually the strongest competitor.", rows:7,
     hint:"Marcus's list: “Push through and call it a rough quarter. A meditation app at 2am. One therapy session, then ‘too busy.’ Wine. A vacation that fixes nothing. Reading research papers about burnout instead of doing anything. Mostly: hide it and keep performing until something breaks.”"},
    {k:"d3_real", label:"Which ONE of those is the real default — the thing most of them actually do?", why:"Your positioning must beat this specific alternative, not a straw man.", rows:3,
     hint:"Marcus: “Hide it and keep performing — because for a high performer, admitting it feels like dying before the collapse does.”"}
  ]
},
{ id:"d4", nav:"Unique attributes", group:null, eyebrow:"Stage 1 · Positioning — Step 4 of 9", title:"Isolate what only you have.",
  intro:["Now the inventory: capabilities, experiences, and features <strong>you have that the alternatives don't.</strong> Ruthlessly concrete. 'I care deeply' is not an attribute; 'I built and sold two companies in this exact industry' is."],
  recall:{title:"From Step 3 — the alternatives you're up against", key:"d3_alts"},
  trap:"Two traps share this step. One: listing virtues (“empathy,” “experience”) instead of verifiable facts — virtues are claims anyone can make. Two: modesty. You will be tempted to soften the credential. The reader deciding whether to trust you NEEDS the unsoftened facts. Save the humility for the prose; the inventory is no place for it.",
  fields:[
    {k:"d4_attrs", label:"List 6–10 attributes none of those alternatives can claim. Then mark your top three with a star.", why:"These are the raw material for everything that follows. Facts, not virtues.", rows:9,
     hint:"Categories to mine: lived experience · credentials · a named method · an audience · insider access · living proof. Marcus's starred three: ★ he collapsed for real — carried out of his own office, 14 documented months back ★ the Rebuild Protocol — the daily structure that actually worked, tested since on 30 others ★ he returned to high performance — proof recovery doesn't mean retreat. Facts, not virtues."},
    {k:"d4_unlike", label:"Complete this sentence three times, once for each of your top three alternatives: “Unlike ___, I / this book ___.”", why:"Forces each attribute to do work against a real alternative.", rows:5,
     hint:"Marcus: “Unlike the researchers, I've been to the bottom — this is the field guide, not the literature review. Unlike the wellness influencers, I have nothing to sell you at the retreat. Unlike your well-meaning partner saying ‘just rest,’ this book knows rest alone doesn't rebuild you.”"},
    {k:"d4_not", label:"What are you NOT? Name the misreadings to prevent.", why:"Positioning is also fencing off. What might a skimming reader mistake this book for?", rows:3,
     hint:"Marcus: “Not a self-care listicle. Not anti-work — I love the work; that was the problem. Not a medical text — and it says clearly where a doctor must take over.”"}
  ]
},
{ id:"d5", nav:"Attributes → value", group:null, eyebrow:"Stage 1 · Positioning — Step 5 of 9", title:"Turn attributes into value: 'so what?'",
  intro:["Attributes are facts about you. Value is what those facts <strong>do for the reader.</strong> For each starred attribute, run the chain: attribute → so what? (benefit) → so what? (value in their life) → and what's your proof?"],
  recall:{title:"From Step 4 — your unique attributes", key:"d4_attrs"},
  trap:"The trap is stopping one ‘so what?’ too early. “I've lived this → so I understand it” stops too early. Being understood matters — but the chain must end in something your reader would trade money or time for, and that can be emotional: relief, confidence, courage. Keep pushing until the chain ends in something your reader would trade money or time for: a faster decision, a mistake avoided, a result achieved.",
  fields:[
    {k:"d5_chain1", label:"Chain 1 — starred attribute → benefit → value → proof.", why:"Keep asking 'so what?' until you hit something the reader would pay to have.", rows:5,
     hint:"Marcus: “I collapsed and rebuilt over 14 months (attribute) → I know which parts of recovery actually move the needle and which just feel virtuous (benefit) → the reader skips the six months I wasted and starts the rebuild that works (value) → proof: my return, and 30 people through the Protocol since.”"},
    {k:"d5_chain2", label:"Chain 2.", why:"", rows:5, opt:true},
    {k:"d5_chain3", label:"Chain 3.", why:"", rows:5, opt:true},
    {k:"d5_themes", label:"Look at your chains. What one or two VALUE THEMES do they cluster into?", why:"Attributes cluster into a small number of value themes — these become the spine of your campaign page.", rows:3,
     hint:"Marcus's clustered into: ‘get caught BEFORE the collapse’ and ‘a rebuild you can do while still employed.’ Emotional and practical at once — yours likely are too."},
    {k:"d5_bookvs", label:"Two different promises: what does the BOOK alone deliver — and what does working with YOU deliver? One line each, plus the evidence for each.", why:"A reader can get real value from the book without ever hiring you, and your client results don't automatically prove what the book alone achieves. Keeping the two promises honest keeps both of them credible.", rows:4,
     hint:"Marcus: “The book: recognize where you are on the curve and start the Protocol — evidence: beta readers said chapter 3 made them cancel a meeting and sleep. Working with me: accountability and judgment inside YOUR specific week — evidence: D.T. and the 30 since.”"}
  ]
},
{ id:"d6", nav:"Who cares a lot", group:null, eyebrow:"Stage 1 · Positioning — Step 6 of 9", title:"Who cares a great deal about that value?",
  intro:["Not who <em>could</em> benefit — who <strong>cares intensely, right now, and will act.</strong> Your best-fit segment is the group for whom your value is a burning need, not a nice-to-have."],
  recall:{title:"From Step 5 — your value themes", key:"d5_themes"},
  trap:"The trap is choosing the audience you LIKE over the audience with urgency and budget. The segment that funds a campaign and a business is the one where the problem has a date on it and money behind it. Affection is not a segmentation criterion; urgency is.",
  fields:[
    {k:"d6_rank", label:"List 3–4 candidate reader groups for YOUR book and rank them — then say why your #1 wins.", why:"Consider: who has the most urgent version of the problem? Who has budget? Whose story do you actually tell in the book?", rows:5,
     hint:"Three tests: urgency (a date on their problem?) · budget · fit (whose story does the book actually tell?). Marcus's ranking: (1) the high performer mid-crack — urgency is this quarter, and they'll pay for a lifeline; (2) the recently collapsed; (3) HR and team leads buying for others; (4) general wellness readers."},
    {k:"d6_person", label:"Now describe the ONE person this book must not fail. So specific it feels too narrow.", why:"Age, role, what just happened to them, what they fear, what they've already tried. Everyone else still gets to buy the book — but this person is who the campaign page speaks to.", rows:6,
     hint:"Marcus's person: “Sam, 38, team lead, the one everyone counts on. Running on four hours' sleep and pretending it's fine, snapping at the kids, googling ‘am I burned out or just weak’ at 2am — then deleting the search history.”"},
    {k:"d6_buyer", label:"Is the BUYER of your services that same person — or someone else?", why:"The individual paying personally vs. an organization buying on their behalf. If companies buy, your campaign needs corporate-facing tiers.", rows:4,
     hint:"Marcus: “The reader is Sam. But companies BUY — 40 copies plus a team workshop — because losing Sam costs them a year of hiring and a team's morale.”"},
    {k:"d6_words", label:"When your person realizes they need help — what do they type into Google, or say to a friend at dinner? Their words, not yours.", why:"Campaign-page headline language comes from here. Your philosophy's vocabulary is earned inside the book; the door opens with their words.", rows:4,
     hint:"Sam's searches: ‘am I burned out or lazy’ · ‘why am I exhausted after sleeping’ · ‘how to keep going when you can't.’ Nobody searches ‘allostatic load’ or ‘sustainable performance framework’ — that's Marcus's language, not Sam's 2am language."}
  ]
},
{ id:"d7", nav:"Market frame", group:null, eyebrow:"Stage 1 · Positioning — Step 7 of 9", title:"Choose the market you'll win.",
  intro:["The market category is context that makes your value obvious <strong>without explanation.</strong> There are three ways to play it: compete <em>head-to-head</em> in an existing category; be the <em>big fish in a smaller pond</em> (a niche of an existing category); or <em>create a new game</em> (rare, expensive — needs missionary marketing)."],
  recall:{title:"From Step 6 — your one person", key:"d6_person"},
  trap:"Two traps. The comfortable one: staying on the ‘memoir’ shelf because that's the book you set out to write — on crowdfunding platforms, memoir-positioned first books are consistently the hardest to fund — the stories can stay; the shelf should sell. The ambitious one: inventing a brand-new category — new categories demand missionary marketing budgets you don't have. The winning move is usually the modest-looking one: a sharp niche of a shelf that already has buyers.",
  fields:[
    {k:"d7_shelf", label:"Name 2–3 shelves this book could sit on. Pick the one you can WIN, and say why.", why:"Category sets reader and publisher expectations you never have to explain.", rows:4,
     hint:"Marcus's candidates: burnout science (owned by researchers) · memoir (hard to fund) · the gap between them: recovery field guides by someone who actually collapsed and came back. He can win the gap."},
    {k:"d7_style", label:"Which of the three styles are you playing — and what's the pond, precisely?", why:"Write it as: 'Within [existing category], for [your person], the [your niche].'", rows:3,
     hint:"Marcus: “Big fish, small pond: within burnout and resilience books, for high performers who are secretly cracking, the recovery field guide by someone who went all the way down and came back.”"}
  ]
},
{ id:"d8", nav:"Why now (trend)", group:null, eyebrow:"Stage 1 · Positioning — Step 8 of 9", title:"Layer on a trend — carefully.",
  intro:["The final layer comes with a warning: a trend only helps if the connection to <strong>your value</strong> is obvious. Trend without positioning confuses; positioning without trend just moves slower. Why does this book matter NOW?"],
  trap:"The trap is trend-jacking — bolting the book onto whatever is loud (AI! the economy!) without a load-bearing connection. If you deleted the trend sentence and the pitch still made sense, the trend wasn't doing anything. The test: does the trend make YOUR person's problem more urgent, or just make the page sound current?",
  fields:[
    {k:"d8_trend", label:"What is happening in the world right now that makes your person's problem urgent — and how does your book connect to it?", why:"This gives media, publishers, and buyers a reason to act this year, not eventually.", rows:5,
     hint:"Marcus: “Burnout is at record levels and the high performers are the ones hiding it — companies are finally budgeting for it because the quiet quitters used to be their best people. The research shelf is full; the survivor's field guide shelf is empty.”"}
  ]
},
{ id:"canvas", nav:"Your positioning", group:null, eyebrow:"Stage 1 · Positioning — Step 9 of 9", title:"Capture it: your positioning canvas.",
  intro:["This is the payoff. Below, your own answers are assembled into your positioning canvas. Read it aloud. Where it rings false, go back and fix the step — not the sentence."],
  canvas:true,
  trap:"The trap at the finish line is wordsmithing — polishing the sentence until it sounds impressive while quietly papering over a weak step. If a slot feels wrong, the problem is upstream: the wrong person, a straw-man alternative, an unproven value. Fix the step; the sentence fixes itself.",
  fields:[
    {k:"c_statement", label:"Now write the positioning statement in your own voice — edit until every clause is true.", why:"Template: For [your person] who [their situation], [your book] is [category] that [value]. Unlike [real alternative], it [unique attribute + proof].", rows:6,
     hint:"Marcus's finished statement: “For high performers who are secretly cracking and would otherwise hide it and keep pushing until something breaks, The Long Way Back is a recovery field guide that turns one real collapse and a 14-month rebuild into the map and the daily protocol for coming back — without giving up the work you love. Unlike the research books and the wellness feed, it was written by someone who was carried out of his own office — and returned.”"}
  ],
  pause:"That completes Stage 1 — a natural place to pause. Everything is saved, and Stage 2 (Messaging) reads better with fresh eyes."
},
{ id:"val", nav:"Reality check", group:null, eyebrow:"Between sittings · Reality check", title:"Test it on three real people.",
  intro:["Before you polish a single headline, show your positioning statement to two or three people who match your one person — not friends who will be kind, people who live the problem. Read it to them, then stay quiet. This is the cheapest validation you will ever run, and it separates what you know from what you were hoping."],
  recall:{title:"Your positioning statement (Step 9)", key:"c_statement"},
  trap:"The trap is skipping this because the statement feels finished. Every author's statement feels finished right up until a real reader repeats it back wrong. Ten minutes of listening now saves a campaign built on a sentence only you understand.",
  fields:[
    {k:"val_said", label:"What did they say the book was about — in THEIR words? And what did they push back on?", why:"Record their words, not your corrections. Where their version differs from yours is exactly where the positioning leaks.", rows:6, opt:true,
     hint:"Marcus heard: “So it's like a recovery program for people like me?” (keep!) and “I figured it was a memoir about your breakdown” (a leak — the subtitle must fix that)."},
    {k:"val_changed", label:"What did they confirm — and what will you change?", why:"Separate the validated parts from the hypotheses that still need work.", rows:4, opt:true}
  ]
},
{ id:"msg", nav:"Messaging", group:"Stage 2 · Messaging", eyebrow:"Stage 2 · Messaging", title:"Turn the positioning into words that land.",
  intro:["Positioning is a decision; messaging is that decision <strong>wearing your reader's language.</strong> Everything here must trace back to Stage 1 — and be written in the words your person uses (Step 6), not the words you love."],
  recall:{title:"Your positioning statement (Stage 1, Step 9)", key:"c_statement"},
  trap:"The trap of this whole stage: writing in YOUR language instead of theirs. Your philosophy's vocabulary belongs inside the book, where you have pages to earn it. Headlines and promises must open with the reader's own words for their pain. Philosophy is the reward, never the door. Second trap: leading with your most entertaining stories instead of the reader's problem — charm attracts admirers; relevance converts buyers.",
  fields:[
    {k:"m_elevator", label:"Your new dinner-party answer: 'What's your book about?' — one breath, aimed at your one person.", why:"Compare it with your old answer from Stage 1, Step 2. If the new one doesn't name who it's for, it isn't done.", rows:3,
     hint:"Marcus: “It's for high performers who are quietly burning out — the ones everyone counts on. I burned out completely, rebuilt over 14 months, and the book is the map I wish I'd had at the first crack.”"},
    {k:"m_promise", label:"The promise, on a Post-it, for that one person only.", why:"This becomes the emotional core of the campaign page — a promise for the bullseye reader, not for everyone.", rows:4,
     hint:"Marcus's Post-it: “You don't have to hit the bottom to come back. Start here.”"},
    {k:"m_headline", label:"Draft the campaign page headline — plus two alternates. Use your reader's own words.", why:"The headline is the single highest-leverage sentence of the campaign. Pull from your Step 6 language bank, not from the book's philosophy.", rows:4,
     hint:"Marcus's three: “You're not lazy. You're burning out. There's a way back.” · “The one everyone counts on is cracking. If that's you, read this.” · “I went all the way down so you only have to read about it.”"},
    {k:"m_messages", label:"One key message for each audience: (1) the reader · (2) the organizational buyer · (3) the publisher.", why:"Same positioning, three translations. The reader buys transformation; the organization buys an outcome for its people; the publisher buys a platform and a market.", rows:6,
     hint:"Marcus — Reader: “You're not weak; you're depleted — here's the rebuild.” Company: “Your best people hide burnout until they're gone; this book plus a workshop catches them while they're still here.” Publisher: “A crowded research shelf, millions searching ‘am I burned out’ — and no field guide by someone who actually came back.”"},
    {k:"m_stories", label:"Which of your stories LEAD the messaging — and which get rationed?", why:"Authority stories prove you can guide the reader; charm stories prove you're interesting. Both belong in the book — decide which kind fronts the campaign.", rows:4,
     hint:"Marcus — Lead: the day he was carried out of his own office, and the 14-month rebuild. Ration: the glory-days agency war stories — one flash to establish the height of the fall, no more."},
    {k:"m_subtitles", label:"Three subtitle options that carry the positioning.", why:"Title and subtitle can evolve together — either way, the subtitle carries the positioning on the cover and in every listing.", rows:4,
     hint:"Marcus's three: “A field guide back from burnout” · “What one collapse and a 14-month rebuild taught me about coming back” · “The recovery protocol for high performers who are secretly cracking.”"}
  ]
},
{ id:"sales", nav:"Outreach readiness", group:"Stage 3 · Sales", eyebrow:"Stage 3 · Sales — Smart Calling (Art Sobczak)", title:"Your campaign outreach, prepared.",
  intro:["Your campaign succeeds through direct, personal outreach — not passive posting. Sobczak's method: never contact anyone 'cold.' Lead with a <strong>possible value proposition</strong> aimed at what they care about, not at your book."],
  recall:{title:"From Groundwork — your network list", key:"dest_network"},
  trap:"Three traps stack up here. Broadcasting instead of asking — in preorder campaigns, personal outreach consistently outperforms posting, so watch where your actual responses come from; the campaign is won one personal message at a time. The ‘I wrote a book’ opener — that's about you; Sobczak's openers are about THEM. And heroic capacity estimates — plan for the outreach you'll do in week three when it's tedious, not week one when it's thrilling.",
  fields:[
    {k:"s_segments", label:"Sort your network into four groups, with rough counts: Champions · High-tier prospects · Amplifiers · Endorsers.", why:"Champions buy and bring others with them. High-tier prospects could take a $1K–$12K tier (services bundled with bulk books). Amplifiers have audiences. Endorsers lend names for the campaign page. Different message, ask, and tier for each.", rows:7},
    {k:"s_top10", label:"For your top 10 high-tier prospects: what problem do THEY have that your service solves? One line each.", why:"'I wrote a book' earns politeness; naming their current problem earns a meeting.", rows:8},
    {k:"s_openers", label:"Draft your three openers: (a) former colleague, now senior, for a team/bulk tier · (b) warm contact for a preorder + share · (c) a respected name you'd ask for an endorsement.", why:"Get honest first versions down — they'll be refined in review.", rows:7,
     hint:"Marcus's (a), to an HR director: “Your engineering leads just shipped the big release — that's exactly when the crashes start. I've built a session on catching burnout before it costs you people; want it in your next leadership offsite?”"},
    {k:"s_capacity", label:"Honest capacity during the campaign: hours per week, and personal messages or calls per day you will truly send.", why:"Winning campaigns front-load week one. Plan targets around real capacity, not aspiration.", rows:3},
    {k:"s_objections", label:"The objections you dread — and your answers.", why:"E.g., 'Why pre-order an unfinished book?' · 'What qualifies you?' Writing the dreaded question defuses it — and becomes campaign-page FAQ copy.", rows:6,
     hint:"Marcus's dreaded one: “Everyone writes about burnout” → “Researchers write about it. I came back from it. This is the field guide, not the literature review.”"}
  ],
  pause:"End of sitting two — another good place to pause. Pricing decisions deserve a clear head."
},
{ id:"sys", nav:"Ladder & pricing", group:"Stage 4 · System", eyebrow:"Stage 4 · System — Key Person of Influence (Daniel Priestley)", title:"The ladder the book opens — priced.",
  intro:["Priestley's five P's — Pitch, Publish, Product, Profile, Partnerships — treat the book as one pillar of a business, not the business. The goal: leave the campaign with an <strong>ascending, priced ladder</strong>, not just book sales. Your ladder becomes the campaign's reward tiers."],
  recall:{title:"From Groundwork — what you sell", key:"dest_offer"},
  trap:"The costly traps here are pricing from fear and the missing middle rung. Underpricing the top of the ladder tells a serious buyer you're not their tier. And a ladder that jumps from a $30 book to a five-figure engagement strands everyone in between; the $250–$900 middle rungs are where strangers become clients. Price the top with a straight face, and build the middle.",
  fields:[
    {k:"f_ladder", label:"Fill in each rung — name and price, free to premium.", why:"Free (a diagnostic or tool) → the book ($20–35 tiers) → mid (group program, workshop, $250–$900) → high (1:1 services) → premium (organizational: workshop, keynote, advisory, $2,500–$12,500).", rows:8,
     hint:"Marcus's ladder (USD, illustrative): free ‘Burnout Audit’ quiz → $25 book → $350 ‘First 90 Days of Recovery’ course → $150/mo recovery circle → $3,000 team workshop day. The full economics live in the Pricing & Bundles workbook."},
    {k:"f_tool", label:"Which exercise or idea from your book becomes your signature named tool?", why:"A named assessment or diagnostic turns readers into leads and gives organizational buyers something concrete to purchase.", rows:4,
     hint:"Marcus: “The Burnout Audit — the where-are-you-on-the-curve check from chapter 2 as a 5-minute self-test. Named, so people send it to the colleague they're worried about.”"},
    {k:"f_profile", label:"Profile audit: where does your person already gather — and where are you visible today?", why:"Social following and activity, email list size, speaking history, podcasts, communities. Honest baseline; 'nowhere yet' is workable — it shifts weight to outreach and partnerships.", rows:5},
    {k:"f_partners", label:"Partnerships: who already owns rooms full of your person?", why:"Industry associations, alumni networks, professional communities, complementary service firms. A partner's newsletter can beat months of solo posting — when their audience matches your person. Treat each partnership as a hypothesis to test.", rows:6},
    {k:"f_scarce", label:"Oversubscription: what will you cap, honestly?", why:"Priestley: demand forms around visible scarcity. How many service slots can you actually deliver? Winning campaigns capped tiers and sold them out. Scarcity you can't honor destroys trust — cap at your real capacity.", rows:4},
    {k:"f_arc", label:"The 12-month arc after the campaign: what's the next season?", why:"Publishers and high-tier buyers want to know the book isn't the finale.", rows:4}
  ]
},
{ id:"pub", nav:"Proposal materials", group:"Stage 5 · The Proposal", eyebrow:"Stage 5 · The Proposal — Campaign raw materials", title:"What the campaign page is built from.",
  recall:{title:"From Groundwork — your campaign goal", key:"dest_goal"},
  intro:["Publishers and backers read campaign pages like balance sheets. This is the raw material — every answer here should already be easy, because the stages before did the thinking."],
  trap:"Two traps at the proposal stage. Burying the credential: if your authority appears as an aside inside the storyteller, the funnel collapses — authority first, story in service of it. And hiding small numbers: an empty ‘platform’ section looks worse than an honest small one plus borrowed reach. Publishers respect a plan; they distrust a blank.",
  fields:[
    {k:"p_bio", label:"Your bio in 100 words — written as AUTHORITY, credential first, story serving it.", why:"The campaign page must lead with why you're trustworthy on this subject, then let the story make it human.", rows:6,
     hint:"Formula: [Name] is a [credentialed role] who has [lived the book's promise]: [2–3 concrete facts]. [One human sentence.] [Who they serve now.] Marcus: “Marcus Hale built and ran a 40-person agency until the morning he collapsed in his own office. His 14-month rebuild became the Rebuild Protocol, now used by 30 recovering high performers. He writes, coaches, and teaches teams to catch burnout before it takes their best people.”"},
    {k:"p_outline", label:"The outline of the whole book — one sentence per section. Mark which parts deliver the METHOD, not just the story.", why:"Campaign proposals need the full outline; publishers weigh whether the book completes its promise.", rows:9,
     hint:"Shape of Marcus's: “Ch 1: the collapse (story). Ch 2: the Burnout Audit — where are you on the curve (METHOD). Ch 3: the first 90 days (METHOD)…” — publishers look for where the reader gets the tools."},
    {k:"p_numbers", label:"Numbers for the 'sales arguments' section — every real number, however small, plus numbers a partner could lend you.", why:"Email list, social reach, client base, corporate contacts, speaking dates, communities you can access. Publishers read this first.", rows:5,
     hint:"Marcus's honest version: “2,500 newsletter readers, 6,800 LinkedIn followers, one viral post (1.2M views) about the collapse, two podcast appearances, an HR community of 9,000 that confirmed they'd share it (borrowed reach).” Small and real beats big and vague."},
    {k:"p_goal", label:"Revisit your campaign goal from Groundwork: still the right call \u2014 or has the work changed it?", why:"You chose (a) preorder volume or (b) revenue and clients before doing the positioning. Now you know your person, your prices, and your network. Confirm or change \u2014 and say what changed it.", rows:3},
    {k:"p_video", label:"The 90-second version of your story you can tell to camera without notes — as bullets.", why:"Publishizer's own platform data shows campaign pages with video convert better. The video gets scripted from these bullets.", rows:6,
     hint:"Marcus's bullets: the morning he was carried out · the 14 months nobody saw · ‘this is the book I needed at the first crack’ · who it's for · the ask."},
    {k:"p_boundaries", label:"Anything in the book you are NOT willing to lead with publicly? For each: headline / mention / book-only.", why:"Your most differentiating material is often your most personal. Set the exposure level before any public copy is written — not after it's live.", rows:5,
     hint:"Marcus: “What the collapse did to my marriage: book-only. The collapse itself and the rebuild: headline — it's why Sam will trust me. My medication: mention, once, factually.”"}

/* ---------------- state ---------------- */
const LS_KEY = "mm-author-positioning-v1";
let storageOK = true;
try{
  localStorage.setItem(LS_KEY+"-test","1"); localStorage.removeItem(LS_KEY+"-test");
}catch(e){ storageOK = false; }

let state = {};
try{ state = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); }catch(e){ state = {}; }
const answers = state.answers || {};
let current = Math.min(state.step || 0, STEPS.length-1);

function persist(){
  state.answers = answers; state.step = current;
  if(storageOK){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){ storageOK=false; }
  }
  const b = document.getElementById("savebadge");
  if(storageOK){
    b.textContent = "Saved " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  }else{
    b.textContent = "Autosave unavailable"; b.classList.add("warn");
    document.getElementById("storagewarn").classList.add("show");
  }
}
let saveTimer=null;
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ persist(); try{ refreshNav(); }catch(e){} }, 400); }

/* ---------------- render ---------------- */
const main = document.getElementById("main");
const navlist = document.getElementById("navlist");

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function buildNav(){
  navlist.innerHTML = "";
  STEPS.forEach((st,i)=>{
    if(st.group){
      const g=document.createElement("li"); g.className="navgroup"; g.textContent=st.group; g.setAttribute("role","presentation");
      navlist.appendChild(g);
    }
    const li=document.createElement("li");
    const b=document.createElement("button");
    b.innerHTML = `<span class="navnum">${String(i+1).padStart(2,"0")}</span><span>${esc(st.nav)}</span><span class="navdot">●</span>`;
    b.addEventListener("click", ()=>go(i));
    b.id = "nav-"+st.id;
    li.appendChild(b); navlist.appendChild(li);
  });
}

function stepDone(st){
  const req = st.fields.filter(f=>!f.opt);
  if(!req.length) return false;
  return req.every(f=> (answers[f.k]||"").trim().length>0);
}

function refreshNav(){
  STEPS.forEach((st,i)=>{
    const b=document.getElementById("nav-"+st.id);
    b.classList.toggle("active", i===current);
    b.classList.toggle("done", stepDone(st));
    if(i===current){ b.setAttribute("aria-current","step"); } else { b.removeAttribute("aria-current"); }
  });
  document.getElementById("mobilelabel").textContent = `${current+1} of ${STEPS.length} · ${STEPS[current].nav}`;
  let tot=0, ans=0;
  STEPS.forEach(stp=>stp.fields.forEach(f=>{ if(!f.opt){ tot++; if((answers[f.k]||"").trim()) ans++; } }));
  const fill=document.getElementById("railmeterfill");
  if(fill){ fill.style.width = (tot? Math.round(ans/tot*100):0) + "%"; }
  const rp=document.getElementById("railprog");
  if(rp){ rp.textContent = ans + " of " + tot + " questions answered"; }
}

function fieldHTML(f){
  const val = esc(answers[f.k]||"");
  return `<div class="q">
    <label for="f_${f.k}">${f.label}${f.opt?`<span class="optional">optional</span>`:""}</label>
    ${f.why?`<p class="why">${f.why}</p>`:""}
    <textarea id="f_${f.k}" data-key="${f.k}" rows="${f.rows||4}" placeholder="${f.ph?esc(f.ph):"Your answer…"}">${val}</textarea>
    ${f.hint?`<details class="hintbox"><summary>${HINT}</summary><div class="hintbody">${f.hint}</div></details>`:""}
  </div>`;
}

function slotSpan(key, fallback){
  const v = (answers[key]||"").trim();
  if(!v) return `<span class="slot empty">[${fallback}]</span>`;
  const short = v.length>220 ? v.slice(0,220)+"…" : v;
  return `<span class="slot">${esc(short)}</span>`;
}

function canvasCard(title, key, note){
  const v = (answers[key]||"").trim();
  return `<div class="recall" style="margin-top:12px"><div class="rc-title">${title}${note?` · <span style="text-transform:none; letter-spacing:0">${note}</span>`:""}</div><div class="rc-body ${v?"":"empty"}">${v?esc(v):"(not answered yet — go back to that step)"}</div></div>`;
}
function canvasHTML(){
  return `<div class="canvas-frame" style="margin-top:20px">Your positioning, in parts — from your own answers</div>
  ${canvasCard("Your reader (Step 6)","d6_person","")}
  ${canvasCard("Their real alternative (Step 3)","d3_real","")}
  ${canvasCard("Your market frame (Step 7)","d7_style","")}
  ${canvasCard("The value (Step 5)","d5_themes","")}
  ${canvasCard("What only you bring (Step 4)","d4_attrs","your starred three carry the statement")}
  ${canvasCard("Proof (Step 5, chain 1)","d5_chain1","")}
  ${canvasCard("Why now (Step 8)","d8_trend","optional — strong positioning can be evergreen")}
  <p class="intro" style="margin-top:14px">Read the parts, not a pre-written sentence. If any card rings false, fix that step first — then write the statement below in your own words.</p>`;
}

function reviewHTML(){
  let total=0, filled=0, optTotal=0, optFilled=0;
  let blocks="";
  STEPS.forEach(st=>{
    if(!st.fields.length) return;
    let items="";
    st.fields.forEach(f=>{
      const v=(answers[f.k]||"").trim();
      if(f.opt){ optTotal++; if(v) optFilled++; }
      else { total++; if(v) filled++; }
      items += `<div class="review-item"><p class="rq">${f.label}</p><p class="ra ${v?"":"blank"}">${v?esc(v):"— not answered yet —"}</p></div>`;
    });
    blocks += `<div class="review-block"><h3>${esc(st.eyebrow)} — ${esc(st.title)}</h3>${items}</div>`;
  });
  const pct = total? Math.round(filled/total*100):0;
  return `<p class="intro"><strong>${filled} of ${total}</strong> required questions answered · ${optFilled} of ${optTotal} optional.</p>
  <div class="meter"><div style="width:${pct}%"></div></div>
  ${blocks}
  <div class="exportrow">
    <button class="btn" id="dl">Download my answers (PDF)</button>
    <button class="btn ghost" id="cp">Copy all answers</button>
    <button class="btn ghost" id="st">Show answers as text</button>
    <button class="btn ghost" id="ml">Open email to Mint Mantis</button>
  </div>
  <div id="textpanel" style="display:none; margin-top:18px">
    <p class="exportnote" style="margin:0 0 8px"><strong>Manual copy (works in every browser):</strong> click inside the box, press ⌘A (or Ctrl+A) then ⌘C (or Ctrl+C), and paste into an email to Mint Mantis.</p>
    <button class="btn ghost" id="sel" style="margin-bottom:10px">Select all for me</button>
    <textarea id="mdtext" readonly style="width:100%; min-height:320px; border:1px solid var(--line-strong); border-radius:9px; background:var(--paper); color:var(--ink); font:12.5px/1.5 ui-monospace,Menlo,monospace; padding:12px"></textarea>
  </div>
  <p class="exportnote">The PDF saves to your <strong>Downloads folder</strong> — attach it to an email to <a href="mailto:outreach@mintmantis.com">outreach@mintmantis.com</a>. If the buttons don't respond in this browser, use <strong>"Show answers as text"</strong> — manual select-and-copy works everywhere. Your answers also stay saved in this browser.</p>`;
}

function render(){
  const st = STEPS[current];
  let html = (storageOK ? "" : '<div class="callout trap" style="max-width:640px; margin-bottom:18px"><span class="cn">Autosave is blocked in this browser</span>Your answers live only on this open page. Use \u201cSave progress to file\u201d before closing.</div>') + `<section class="step visible" aria-labelledby="steptitle">
    <p class="eyebrow">${esc(st.eyebrow)}</p>
    <h2 id="steptitle">${esc(st.title)}</h2>
    ${st.intro.map(p=>`<p class="intro">${p}</p>`).join("")}
    ${st.coach?`<div class="callout"><span class="cn">Coach's note</span>${st.coach}</div>`:""}
    ${st.trap?`<div class="callout trap"><span class="cn">The trap at this step</span>${st.trap}</div>`:""}
    ${st.html||""}
    ${st.recall?`<div class="recall"><div class="rc-title">${esc(st.recall.title)}</div><div class="rc-body ${(answers[st.recall.key]||"").trim()?"":"empty"}">${(answers[st.recall.key]||"").trim()?esc(answers[st.recall.key]):"(You haven't answered that step yet — consider going back first.)"}</div></div>`:""}
    ${st.canvas?canvasHTML():""}
    ${st.fields.map(fieldHTML).join("")}
    ${st.review?reviewHTML():""}
    <div class="stepnav">
      ${current>0?`<button class="btn ghost" id="prev">← Back</button>`:""}
      ${current<STEPS.length-1?`<button class="btn" id="next">${current===0?"Begin →":"Save & continue →"}</button>`:""}
      ${current>0?`<button class="btn ghost" id="savemini" title="Download a progress file you can resume from on any device">Save a backup file</button>`:""}
      <span class="stepcount">${current+1} / ${STEPS.length}</span>
    </div>
    ${st.pause?`<p style="font-size:13px; color:var(--muted); margin-top:14px; border-top:1px dashed var(--line-strong); padding-top:10px">${st.pause}</p>`:""}
  </section>`;
  main.innerHTML = html;
  main.querySelectorAll("textarea[data-key]").forEach(t=>{
    t.addEventListener("input", e=>{ answers[e.target.dataset.key]=e.target.value; queueSave(); });
  });
  const nx=document.getElementById("next"); if(nx) nx.addEventListener("click", ()=>go(current+1));
  const pv=document.getElementById("prev"); if(pv) pv.addEventListener("click", ()=>go(current-1));
  const sm=document.getElementById("savemini"); if(sm) sm.addEventListener("click", saveProgressFile);
  if(st.review){
    document.getElementById("dl").addEventListener("click", download);
    document.getElementById("cp").addEventListener("click", copyAll);
    document.getElementById("ml").addEventListener("click", ()=>{ location.href="mailto:outreach@mintmantis.com?subject="+encodeURIComponent("My positioning workbook answers"); });
    document.getElementById("st").addEventListener("click", ()=>{
      const p=document.getElementById("textpanel");
      const show = p.style.display==="none";
      p.style.display = show?"block":"none";
      if(show) document.getElementById("mdtext").value = buildMarkdown();
    });
    document.getElementById("sel").addEventListener("click", ()=>{
      const t=document.getElementById("mdtext"); t.focus(); t.select();
    });
  }
  refreshNav();
  const hd = document.getElementById("steptitle");
  if(hd){ hd.setAttribute("tabindex","-1"); try{ hd.focus({preventScroll:true}); }catch(e){} }
  window.scrollTo({top:0});
}

function go(i){
  current = Math.max(0, Math.min(i, STEPS.length-1));
  persist(); render();
}

/* ---------------- export ---------------- */
function buildMarkdown(){
  let md = "# Positioning Workbook Answers\n";
  md += "*"+((answers["au_name"]||"Author").trim())+" · "+((answers["au_book"]||"").trim())+" · exported "+new Date().toLocaleDateString()+" · prepared with Mint Mantis*\n\n";
  STEPS.forEach(st=>{
    if(!st.fields.length) return;
    md += "## "+st.eyebrow+" — "+st.title+"\n\n";
    st.fields.forEach(f=>{
      const v=(answers[f.k]||"").trim();
      md += "**"+f.label+"**\n\n"+(v||"_(not answered)_")+"\n\n";
    });
  });
  return md;
}
function pdfSafe(s){
  return String(s)
    .replace(/→/g,"->").replace(/←/g,"<-")
    .replace(/[★●◆✦]/g,"*")
    .replace(/·/g,"-").replace(/✓/g,"[x]")
    .replace(/[^\x20-\xFF\n‘’“”–—…]/g,"");
}
function buildPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"a4"});
  const L=56, W=483, BOTTOM=780;
  let y=64;
  const room = need => { if(y+need>BOTTOM){ doc.addPage(); y=64; } };
  const put = (text, size, style, color, gapAfter)=>{
    doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor(color);
    const lines = doc.splitTextToSize(pdfSafe(text), W);
    const lh = size*1.35;
    lines.forEach(ln=>{ room(lh); doc.text(ln, L, y); y+=lh; });
    y+=gapAfter;
  };
  put("Positioning Workbook Answers", 16, "bold", "#1a1a1a", 4);
  put(((answers["au_name"]||"Author").trim())+" — "+((answers["au_book"]||"").trim())+" — exported "+new Date().toLocaleDateString()+" — prepared with Mint Mantis", 9.5, "normal", "#666666", 14);
  STEPS.forEach(st=>{
    if(!st.fields.length) return;
    room(60);
    put(st.eyebrow.toUpperCase(), 8.5, "bold", "#206B4E", 2);
    put(st.title, 12.5, "bold", "#1a1a1a", 8);
    st.fields.forEach(f=>{
      const v=(answers[f.k]||"").trim();
      room(40);
      put(f.label, 10, "bold", "#333333", 2);
      if(v){ put(v, 10, "normal", "#1a1a1a", 10); }
      else { put("(not answered)", 10, "italic", "#999999", 10); }
    });
    y+=6;
  });
  return doc;
}
function pdfCanRender(t){ return !/[^\x00-\xFF\u2018\u2019\u201C\u201D\u2013\u2014\u2026\u2192\u2190\u2605\u25CF\u25C6\u00B7\u2713]/.test(t); }
function download(){
  const btn=document.getElementById("dl");
  if(window.jspdf && window.jspdf.jsPDF && !pdfCanRender(buildMarkdown())){
    if(btn){ btn.textContent = "Opening your browser's print dialog \u2014 choose \u201cSave as PDF\u201d"; setTimeout(()=>{ btn.textContent = "Download my answers (PDF)"; }, 6000); }
    setTimeout(()=>{ try{ window.print(); }catch(e){} }, 150);
    return;
  }
  try{
    if(window.jspdf && window.jspdf.jsPDF){
      buildPDF().save("Positioning-Workbook-Answers.pdf");
    }else{
      if(btn && btn.id==="dl"){ btn.textContent="No PDF engine here \u2014 saved a text file instead (check Downloads)"; setTimeout(()=>{ btn.textContent="Download my answers (PDF)"; }, 6000); }
      const blob = new Blob([buildMarkdown()], {type:"text/markdown"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "Positioning-Workbook-Answers.md";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
      return;
    }
    if(btn && btn.id==="dl"){ btn.textContent="PDF offered — check your Downloads folder"; setTimeout(()=>{btn.textContent="Download my answers (PDF)";}, 4000); }
  }catch(e){
    if(btn && btn.id==="dl"){ btn.textContent="Download blocked — use 'Show answers as text'"; }
  }
}
function copyAll(){
  const btn=document.getElementById("cp");
  navigator.clipboard.writeText(buildMarkdown()).then(()=>{ btn.textContent="Copied ✓"; setTimeout(()=>btn.textContent="Copy all answers",2000); },
    ()=>{ btn.textContent="Copy failed — use Download"; });
}

/* ---------------- chrome ---------------- */
document.getElementById("mobiletoggle").addEventListener("click", ()=>{
  const w=document.getElementById("navwrap");
  const open=w.classList.toggle("open");
  document.getElementById("mobiletoggle").setAttribute("aria-expanded", open?"true":"false");
});
function progressSnapshot(){
  return {workbook: LS_KEY, savedAt: new Date().toISOString(), step: current, answers: answers};
}
function saveProgressFile(){
  const raw = (answers["au_name"]||"author").trim().replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  const name = raw || "author";
  const blob = new Blob([JSON.stringify(progressSnapshot(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name + "-workbook-progress.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  const b = document.getElementById("savefilebtn");
  if(b){ b.textContent = "Saved to your Downloads \u2713"; setTimeout(()=>{ b.textContent = "Save progress to file"; }, 3500); }
}
function importProgress(text){
  let obj;
  try{ obj = JSON.parse(text); }catch(e){ alert("That file could not be read. Please choose a progress file saved from this workbook."); return; }
  if(!obj || typeof obj.answers !== "object" || obj.answers === null){ alert("That file does not look like a saved progress file."); return; }
  if(obj.workbook && obj.workbook !== LS_KEY){
    if(!confirm("This file was saved from a different workbook. Load it here anyway?")) return;
  }
  const incoming = {};
  Object.keys(obj.answers).forEach(k=>{ if(typeof obj.answers[k] === "string") incoming[k] = obj.answers[k]; });
  if(!Object.keys(incoming).length){ alert("No usable answers were found in that file."); return; }
  if(!confirm("Load this progress file? Questions saved in the file will replace your current answers for those questions. Questions not in the file keep what you have now.")) return;
  Object.keys(incoming).forEach(k=>{ answers[k] = incoming[k]; });
  if(typeof obj.step === "number") current = Math.max(0, Math.min(obj.step, STEPS.length-1));
  persist(); render();
  const b = document.getElementById("loadfilebtn");
  if(b){ b.textContent = "Progress restored \u2713"; setTimeout(()=>{ b.textContent = "Resume from a saved file"; }, 3500); }
}
document.getElementById("savefilebtn").addEventListener("click", saveProgressFile);
document.getElementById("loadfilebtn").addEventListener("click", ()=>{ document.getElementById("loadfileinput").click(); });
document.getElementById("loadfileinput").addEventListener("change", (e)=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>importProgress(String(r.result));
  r.readAsText(f);
  e.target.value = "";
});
if(!storageOK){
  document.getElementById("storagewarn").classList.add("show");
  const b=document.getElementById("savebadge");
  b.textContent="Autosave unavailable"; b.classList.add("warn");
}

buildNav(); render();
</script>
</body>
</html>
